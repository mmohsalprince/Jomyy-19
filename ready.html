<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Are You Ready? ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="ready-page">
    <div class="ambient-sparkles" aria-hidden="true"></div>

    <main class="ready-card">

        <span class="ready-heart">♡</span>

        <p class="ready-eyebrow">BEFORE WE BEGIN...</p>

        <h1 class="ready-title">
            Are You
            <span>Ready?</span>
        </h1>

        <p class="ready-arabic" lang="ar" dir="rtl">
            طب بصي بقى... مستعدة؟ 👀
        </p>

        <p class="ready-description">
             ياريت تركزي معايا  مش زي ما بتقعدي في المحاضرات و السكاشن نايمة
        </p>

        <div class="ready-options">

            <button class="ready-button" type="button" data-choice="yes">
                أيووووااا! 💗
            </button>

            <button class="ready-button secondary" type="button" data-choice="go">
                يلااا بينااا! 🌷
            </button>

        </div>

        <p class="ready-response" aria-live="polite"></p>

        <span class="ready-decoration decoration-one">✿</span>
        <span class="ready-decoration decoration-two">♡</span>

    </main>

    <script src="script.js"></script>

</body>
</html>
