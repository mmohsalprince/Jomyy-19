<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy 19th Birthday ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="birthday-reveal-page">
    <!-- Birthday loading screen -->
<div class="birthday-loader" id="birthdayLoader">

    <div class="loader-heart">♡</div>

    <h1>معلش هنتعبك ثواني</h1>

    <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <small>Just a little moment... </small>

</div>

<!-- Party poppers and balloons -->
<div class="birthday-celebration" aria-hidden="true"></div>

    <!-- Floating decorations -->
    <div class="birthday-particles" aria-hidden="true"></div>

    <main class="birthday-reveal-card">

        <p class="birthday-top-note">
            ✧ A SPECIAL DAY FOR A SPECIAL PERSON ✧
        </p>

        



        <h1 class="birthday-big-title">
            Happy<br>
            <span>Birthdayyyyy!</span>
        </h1>

        <div class="birthday-number">
            <span>1</span>
            <span>9</span>
        </div>

        <p class="birthday-arabic" lang="ar" dir="rtl">
            كل سنة وإنتي طيبة يا جوميييي 💗
        </p>



        <div class="birthday-divider">
            <span>♡</span>
            <span>✿</span>
            <span>♡</span>
        </div>

        <button class="birthday-continue-button" type="button">
            نخش عل هدايا بقا ؟؟
            <span>♡</span>
        </button>



    </main>

    <script src="script.js"></script>

</body>

</html>
